spring:
  application:
    name: bd-project-market

  datasource:
    url: jdbc:postgresql://localhost:5432/shop_db
    username: postgres
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  logging:
    level:
      root: INFO
      com.shop.system: debug

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080