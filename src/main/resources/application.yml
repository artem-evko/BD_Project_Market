spring:
  application:
    name: bd-project-market

  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/shop_db?sslmode=disable
    username: shop
    password: shop
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

logging:
  level:
    org.springframework.boot.context.properties: TRACE
    org.springframework.core.env: DEBUG


server:
  port: 8080
